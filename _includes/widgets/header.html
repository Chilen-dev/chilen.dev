<header id="site-header">
  <style>
    #site-header {
      box-sizing: border-box;
      padding-top: calc({{ layout.header_float_offset }}px + var(--spacing-regular));
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding-inline: 10%;
      transition: padding-inline 150ms ease;
    }

    #site-header.is-fixed {
      padding-top: var(--spacing-regular);
      position: fixed;
      padding-inline: var(--spacing-large);
    }

    #site-header a {
      text-decoration: none;
      color: inherit;
      border-radius: 9999px;
      transition: background-color 100ms ease;
    }

    #site-header a.active {
      color: var(--on-secondary-container);
    }

    #site-header a:hover {
      background-color: color-mix(
        in srgb,
        var(--on-surface) var(--hover-state-layer-opacity),
        transparent
      );
    }

    #site-header a:hover.active {
      background-color: color-mix(
        in srgb,
        var(--on-secondary-container) var(--hover-state-layer-opacity),
        transparent
      );
    }

    #header-nav {
      z-index: -1;
      position: relative;
      height: 60px;
      display: flex;
      background-color: var(--surface-container);
      width: 100%;
      border-radius: 9999px;
      box-shadow: 0 1px 4px 0 color-mix(in srgb, var(--shadow) 15%, transparent);
      overflow-x: auto;
      transition: height 150ms ease;
    }

    #site-header.is-fixed #header-nav {
      height: 80px;
    }

    #header-nav .nav-item {
      position: relative;
      flex: 1 0 0;
      display: flex;
      gap: var(--spacing-small);
      justify-content: center;
      align-items: center;
      height: 100%;
      padding-inline: 16px;
    }

    #header-nav .nav-item .icon {
      font-family: IconsOutlined;
      font-size: var(--icon-size-regular);
    }

    #header-nav .nav-item.active .icon {
      font-family: IconsFilled;
    }

    #header-nav .nav-item .label {
      font-family: GoogleFlex-Regular;
      font-size: var(--font-size-small);
    }

    #header-nav .nav-item .active-indicator {
      position: absolute;
      height: 100%;
      border-radius: 9999px;
      background-color: var(--secondary-container);
      opacity: 0;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      width: 0%;
      margin: auto;
      transition: width 150ms ease, opacity 150ms ease;
    }

    #header-nav .nav-item.active .active-indicator {
      width: 100%;
      opacity: 1;
    }

  </style>

  <nav id="header-nav">
    <a class="nav-item" href="#home">
      <div class="active-indicator"></div>
      <p class="icon">home</p>
      <p class="label">Home</p>
    </a>

    <a class="nav-item" href="#features">
      <div class="active-indicator"></div>
      <p class="icon">stars</p>
      <p class="label">Features</p>
    </a>

    <a class="nav-item" href="#download">
      <div class="active-indicator"></div>
      <p class="icon">download</p>
      <p class="label">Download</p>
    </a>

    <a class="nav-item" href="#faq">
      <div class="active-indicator"></div>
      <p class="icon">help</p>
      <p class="label">FAQ</p>
    </a>
  </nav>
</header>


<script>
  const header = document.querySelector("#site-header");
  const floatOffset = Number("{{ layout.header_float_offset }}") || 0;

  const links = [...document.querySelectorAll("#header-nav a")];

  function getSections() {
    return links
      .map((link) => document.getElementById(link.getAttribute("href").slice(1)))
      .filter(Boolean);
  }

  function updateActiveLink() {
    const headerBottom = header.getBoundingClientRect().bottom;
    const sections = getSections();
    let activeIndex = 0;

    sections.forEach((section, index) => {
      if (section.getBoundingClientRect().top <= headerBottom) {
        activeIndex = index;
      }
    });

    links.forEach((link, index) => {
      link.classList.toggle("active", index === activeIndex);
    });
  }

  function updateHeader() {
    const scrollY = window.scrollY;
    const isFixed = scrollY > floatOffset;
    header.classList.toggle("is-fixed", isFixed);

    const progress = floatOffset > 0 ? Math.min(scrollY / floatOffset, 1) : 1;
    header.style.paddingTop =
      "calc(" + (1 - progress) * floatOffset + "px + var(--spacing-regular))";

    updateActiveLink();
  }
  updateHeader();

  window.addEventListener("scroll", updateHeader, { passive: true });
  window.addEventListener("resize", updateActiveLink);
  document.addEventListener("DOMContentLoaded", updateActiveLink);
  window.addEventListener("load", updateActiveLink);
</script>
