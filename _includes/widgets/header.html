<header id="site-header">
  <style>
    :root {
      --nav-padding: 6px;
      --item-width: 8rem;
    }

    #site-header {
      box-sizing: border-box;
      padding-top: var(--spacing-regular);
      position: fixed;
      width: 100%;
      z-index: 1000;
      overflow-x: auto;
    }

    #site-header a {
      text-decoration: none;
      color: inherit;
      border-radius: 9999px;
      transition: color 100ms var(--easing-standard), background-color 100ms var(--easing-standard);
    }

    #site-header a.active {
      color: var(--on-secondary-container);
    }

    #site-header a:hover {
      background-color: color-mix(
        in srgb,
        var(--on-surface) var(--hover-state-layer-opacity),
        transparent
      );
    }

    #site-header a:hover.active {
      background-color: color-mix(
        in srgb,
        var(--on-secondary-container) var(--hover-state-layer-opacity),
        transparent
      );
    }

    #header-nav {
      z-index: -1;
      padding: var(--nav-padding);
      position: relative;
      height: calc(var(--header-nav-height) - 2 * var(--nav-padding));
      display: flex;
      background-color: var(--surface-container);
      border-radius: 9999px;
      width: fit-content;
      margin-inline: auto;
      box-shadow: 0 1px 4px 0 color-mix(in srgb, var(--shadow) 15%, transparent);
    }

    #header-nav .nav-item {
      position: relative;
      display: flex;
      gap: var(--spacing-small);
      justify-content: center;
      align-items: center;
      height: 100%;
      width: var(--item-width);
    }

    #header-nav .nav-item .icon {
      font-family: IconsOutlined;
      font-size: var(--icon-size-regular);
    }

    #header-nav .nav-item.active .icon {
      font-family: IconsFilled;
    }

    #header-nav .nav-item .label {
      font-family: GoogleFlex-Regular;
      font-size: var(--font-size-small);
    }

    #header-nav .nav-item .active-indicator {
      position: absolute;
      height: 100%;
      border-radius: 9999px;
      background-color: var(--secondary-container);
      opacity: 0;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      width: 0%;
      margin: auto;
      transition: width 150ms var(--easing-standard), opacity 150ms var(--easing-standard);
    }

    #header-nav .nav-item.active .active-indicator {
      width: 100%;
      opacity: 1;
    }

    @media (max-width: 700px) {
      :root {
        --item-width: auto;
      }

      #site-header {
        padding-top: var(--spacing-smaller);
      }

      #header-nav .nav-item {
        padding-inline: var(--spacing-regular);
      }

      #header-nav .nav-item .label {
        display: none;
      }
    }
  </style>

  <nav id="header-nav">
    <a class="nav-item" href="#home">
      <div class="active-indicator"></div>
      <p class="icon">home</p>
      <p class="label">Home</p>
    </a>

    <a class="nav-item" href="#features">
      <div class="active-indicator"></div>
      <p class="icon">stars</p>
      <p class="label">Features</p>
    </a>

    <a class="nav-item" href="#showcase">
      <div class="active-indicator"></div>
      <p class="icon">palette</p>
      <p class="label">Showcase</p>
    </a>

    <a class="nav-item" href="#download">
      <div class="active-indicator"></div>
      <p class="icon">download</p>
      <p class="label">Download</p>
    </a>

    <a class="nav-item" href="#faq">
      <div class="active-indicator"></div>
      <p class="icon">help</p>
      <p class="label">FAQ</p>
    </a>
  </nav>
</header>


<script>
  const header = document.querySelector("#site-header");

  const links = [...document.querySelectorAll("#header-nav a")];

  let updatesPaused = false;
  let unpauseTimeout;

  links.forEach((link) => {
    link.addEventListener("click", (event) => {
      const target = document.getElementById(link.getAttribute("href").slice(1));
      if (!target) return;

      event.preventDefault();
      history.pushState(null, "", link.getAttribute("href"));

      updatesPaused = true;
      links.forEach((other) => other.classList.toggle("active", other === link));

      target.scrollIntoView({ behavior: "smooth" });

      clearTimeout(unpauseTimeout);
      unpauseTimeout = setTimeout(() => (updatesPaused = false), 1000);
    });
  });

  window.addEventListener("scrollend", () => {
    clearTimeout(unpauseTimeout);
    updatesPaused = false;
  });

  function getSections() {
    return links
      .map((link) => document.getElementById(link.getAttribute("href").slice(1)))
      .filter(Boolean);
  }

  function updateActiveLink() {
    if (updatesPaused) return;

    const headerBottom = header.getBoundingClientRect().bottom;
    const sections = getSections();
    let activeIndex = sections.length - 1;

    for (let index = 0; index < sections.length; index++) {
      if (sections[index].getBoundingClientRect().bottom > headerBottom) {
        activeIndex = index;
        break;
      }
    }

    links.forEach((link, index) => {
      link.classList.toggle("active", index === activeIndex);
    });
  }

  updateActiveLink();

  window.addEventListener("scroll", updateActiveLink, { passive: true });
  window.addEventListener("resize", updateActiveLink);
  document.addEventListener("DOMContentLoaded", updateActiveLink);
  window.addEventListener("load", updateActiveLink);

  window.addEventListener("load", () => {
    if (location.hash) {
      history.replaceState(null, "", location.pathname + location.search);
    }
  });
</script>
