<meta charset="utf-8">

<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">

{% if include.content == "404" %}
    <!-- The "robots" metadata disallowing page indexing is manually added to the 404 page since accessing it directly returns HTTP Status Code 200 -->
    <meta name="robots" content="noindex, nofollow">
{% endif %}

<meta name="color-scheme" content="dark light">
<link rel="stylesheet" href="/assets/css/theme-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/assets/css/theme-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/css/main.css">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ include.content | prepend: "/" }}">
{% if page.image %}
    <meta property="og:image" content="{{ page.image | absolute_url }}">
{% else %}
    <meta property="og:image" content="{{ site.url }}/assets/images/social-preview.png">
{% endif %}

<link rel="icon" type="image/png" href="/assets/icons/favicon.png">

<link rel="canonical" href="{{ site.url }}{{ include.content | prepend: "/" }}">
