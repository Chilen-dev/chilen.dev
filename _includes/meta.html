<meta charset="utf-8">
<style>
  html {
    visibility: hidden;
  }

  html.fonts-ready {
    visibility: visible;
  }
</style>

<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}">

{% if include.content == "404" %}
    <!-- The "robots" metadata disallowing page indexing is manually added to the 404 page since accessing it directly returns HTTP Status Code 200 -->
    <meta name="robots" content="noindex, nofollow">
{% endif %}

<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF8FF" media="(prefers-color-scheme: light)">
<link rel="preload" href="/assets/fonts/NotoSans-Regular.woff" as="font" crossorigin>
<link rel="preload" href="/assets/fonts/NotoSans-Medium.woff" as="font" crossorigin>
<link rel="preload" href="/assets/fonts/NotoSans-Black.woff" as="font" crossorigin>
<link rel="preload" href="/assets/fonts/MaterialSymbolsRounded_28pt-Regular.woff" as="font" crossorigin>
<link rel="preload" href="/assets/fonts/MaterialSymbolsRounded_Filled_28pt-Regular.woff" as="font" crossorigin>
<link rel="preload" href="/assets/fonts/NotoSansMono-Regular.woff" as="font" crossorigin>
<link rel="stylesheet" href="/assets/css/theme-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="/assets/css/theme-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/assets/css/main.css">
{% if page.css %}
    {% for css in page.css %}
        <link rel="stylesheet" href="/assets/css/{{ css }}.css">
    {% endfor %}
{% endif %}
<script src="/assets/js/code-with-copy.js" defer></script>

<noscript>
  <style>
    html {
      visibility: visible;
    }
  </style>
</noscript>
<script>
  const revealWhenFontsSettle = () => document.documentElement.classList.add("fonts-ready");

  Promise.allSettled(
    [
      "1rem GoogleFlex-Regular",
      "1rem GoogleFlex-Medium",
      "1rem GoogleFlex-Black",
      "1rem IconsOutlined",
      "1rem IconsFilled",
      "1rem NotoSans-Mono",
    ].map((font) => document.fonts.load(font))
  ).then(revealWhenFontsSettle);

  setTimeout(revealWhenFontsSettle, 5000);
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ site.url }}{{ include.content | prepend: "/" }}">
{% if page.image %}
    <meta property="og:image" content="{{ page.image | absolute_url }}">
{% else %}
    <meta property="og:image" content="{{ site.url }}/assets/images/social-preview.png">
{% endif %}

<link rel="icon" type="image/png" href="/assets/icons/favicon.png">

<link rel="canonical" href="{{ site.url }}{{ include.content | prepend: "/" }}">
{% if include.content == "" %}
    <!-- Homepage only: the hero screenshot is the largest contentful paint image -->
    <link rel="preload" href="/assets/screenshots/dark/home.webp" as="image" media="(prefers-color-scheme: dark)" fetchpriority="high">
    <link rel="preload" href="/assets/screenshots/light/home.webp" as="image" media="(prefers-color-scheme: light)" fetchpriority="high">
{% endif %}
