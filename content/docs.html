---
permalink: /docs
title: Chilen Docs
layout: subpage
---

<style type="text/css" media="screen">
  #docs {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #docs > .inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 600px;
  }

  #docs .shape-icon {
    position: relative;
    display: grid;
    place-items: center;
    width: 7rem;
    height: 7rem;
    flex: 0 0 7rem;
    container-type: inline-size;
  }

  #docs .shape-icon > * {
    grid-area: 1 / 1;
  }

  #docs .shape-icon svg {
    width: 100%;
    height: 100%;
    fill: var(--tertiary-container);
    filter: drop-shadow(0 3px 4px color-mix(in srgb, var(--shadow) 25%, transparent));
  }

  #docs .shape-icon .icon {
    z-index: 1;
    font-size: 50cqi;
    color: var(--on-tertiary-container);
  }

  #docs .kicker {
    margin-top: var(--spacing-large);
    font-family: GoogleFlex-Medium;
    font-size: var(--font-size-small);
    color: var(--tertiary);
  }

  #docs h2 {
    margin: var(--spacing-small) 0 0;
    font-family: GoogleFlex-Medium;
  }

  #docs .button-row {
    margin-top: var(--spacing-large);
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(1rem);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  #docs .inner > * {
    animation: rise 500ms var(--easing-emphasized-decelerate) both;
  }

  #docs .inner > *:nth-child(2) { animation-delay: 60ms; }
  #docs .inner > *:nth-child(3) { animation-delay: 120ms; }
  #docs .inner > *:nth-child(4) { animation-delay: 180ms; }
  #docs .inner > *:nth-child(5) { animation-delay: 240ms; }
  #docs .inner > *:nth-child(6) { animation-delay: 300ms; }

  @media (prefers-reduced-motion: reduce) {
    #docs .inner > * {
      animation: none;
    }
  }
</style>

<div id="docs">
  <div class="inner">
    <div class="shape-icon">
      {% include shapes/cookie7.svg %}
      <p class="icon filled">build</p>
    </div>

    <span class="kicker">DOCS</span>
    <h2>Under construction</h2>
    <p>The documentation is still being written. Until then, refer to the <a href="{{ site.project_repo_url }}">repository README</a> for technical stuff.</p>

    <div class="button-row">
      <button
        onclick="location.href='/'"
        class="medium rounded tonal-primary"
      >
        <p class="icon filled">home</p>
        Back to Home
      </button>
    </div>
  </div>
</div>
