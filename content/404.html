---
permalink: /404.html
layout: subpage
---

<style type="text/css" media="screen">
  #error-404 {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #error-404 > .inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 600px;
  }

  #error-404 .shape-icon {
    position: relative;
    display: grid;
    place-items: center;
    width: 7rem;
    height: 7rem;
    flex: 0 0 7rem;
    container-type: inline-size;
  }

  #error-404 .shape-icon > * {
    grid-area: 1 / 1;
  }

  #error-404 .shape-icon svg {
    width: 100%;
    height: 100%;
    fill: var(--tertiary-container);
    filter: drop-shadow(0 3px 4px color-mix(in srgb, var(--shadow) 25%, transparent));
  }

  #error-404 .shape-icon .icon {
    z-index: 1;
    font-size: 50cqi;
    color: var(--on-tertiary-container);
  }

  #error-404 .kicker {
    margin-top: var(--spacing-large);
    font-family: GoogleFlex-Medium;
    font-size: var(--font-size-small);
    color: var(--tertiary);
  }

  #error-404 h1 {
    margin: var(--spacing-small) 0 0;
    line-height: 1;
    font-size: clamp(5rem, 18vw, 9rem);
    font-family: GoogleFlex-Black;
  }

  #error-404 h1 em {
    font-style: normal;
    color: var(--primary);
  }

  #error-404 h2 {
    margin: var(--spacing-regular) 0 0;
    font-family: GoogleFlex-Medium;
  }

  #error-404 .button-row {
    margin-top: var(--spacing-large);
    display: flex;
    gap: var(--spacing-small);
  }

  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(1rem);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  #error-404 .inner > * {
    animation: rise 500ms var(--easing-emphasized-decelerate) both;
  }

  #error-404 .inner > *:nth-child(2) { animation-delay: 60ms; }
  #error-404 .inner > *:nth-child(3) { animation-delay: 120ms; }
  #error-404 .inner > *:nth-child(4) { animation-delay: 180ms; }
  #error-404 .inner > *:nth-child(5) { animation-delay: 240ms; }
  #error-404 .inner > *:nth-child(6) { animation-delay: 300ms; }

  @media (prefers-reduced-motion: reduce) {
    #error-404 .inner > * {
      animation: none;
    }
  }
</style>

<div id="error-404">
  <div class="inner">
    <div class="shape-icon">
      {% include shapes/sunny.svg %}
      <p class="icon filled">music_off</p>
    </div>

    <span class="kicker">LOST TRACK - ERROR 404</span>
    <h1>4<em>0</em>4</h1>
    <h2>Page not found :(</h2>
    <p>The page you're looking for doesn't exist, was moved, or never existed in the first place.</p>

    <div class="button-row">
      <button
        onclick="location.href='/'"
        class="medium rounded filled-primary"
      >
        <p class="icon filled">home</p>
        Back to Home
      </button>
      <button
        onclick="location.href='{{ site.site_bug_report_url }}'"
        class="medium rounded tonal-primary"
      >
        <p class="icon filled">bug_report</p>
        Report a Bug
      </button>
    </div>
  </div>
</div>
